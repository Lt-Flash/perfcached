# haproxy-perfcached.cfg — reference front-end for a perfcached fleet
# (task S51).  Copy the pieces you need; this is not a drop-in whole
# config.
#
# WHAT THIS REPLACES.  The usual Redis pattern is HAProxy in front of
# three redis-sentinel servers: sentinel tracks which node is master,
# writes go to the master, reads to the slaves.  None of that machinery
# is needed here, because the property it manages does not exist:
#
#   * every perfcached node accepts reads AND writes for every key;
#   * a request landing on a node that does not own the key is
#     forwarded internally - a hop, never an error;
#   * control-plane mastership moves without any client-visible role
#     change.
#
# So the sentinel tier is deleted, and HAProxy keeps exactly one job: a
# VIP for clients that cannot learn a topology.
#
# WHO SHOULD BE BEHIND THIS VIP.  Only clients that speak plain RESP
# and have no cluster mode.  NEVER put a cluster-aware client here: it
# fetches CLUSTER SLOTS through the VIP, learns the nodes' real
# addresses, and bypasses the proxy - and if only the VIP is reachable
# from that host, it breaks.  Cluster-aware clients get node addresses
# directly.
#
# ON PERFCACHED'S SIDE: the RESP door is plaintext and has no
# handshake, so `resp_allow` must list the HAProxy machines, and a
# `[secrets] resp` password is strongly advised off-box.

#---------------------------------------------------------------------
# The pool.  One backend, every node, round-robin.
#---------------------------------------------------------------------
backend perfcached
    mode tcp
    balance roundrobin

    # THE HEALTH CHECK, and why it is not `option redis-check`.
    #
    # `option redis-check` sends PING and expects +PONG.  That is a
    # LIVENESS check, not a readiness one: a perfcached node answers
    # PONG while it is still loading its dataset - deliberately, and
    # exactly as real Redis does, because a client must be able to
    # ping a node that is still warming.  Data commands on that node
    # answer `-LOADING` until it is ready.
    #
    # So PING alone would put a warming node into rotation and hand
    # its clients errors.  This check asks a data question as well and
    # refuses the node ONLY while the answer is -LOADING.
    #
    # The second reply is deliberately not pinned to a value.  On a
    # serving node it is either a miss ($-1) or `-ERR no such
    # collection` - which is what you get when the RESP default db
    # index names no collection on this node, and is the common case
    # unless you have a collection literally named "0".  Both prove
    # the node is past the loading gate, which is the whole question:
    # the gate sits in front of command dispatch, so a warming node
    # cannot produce either answer.  Point the probe at a real
    # collection (SELECT first) if you would rather not see -ERR in
    # your check logs; it does not make the check stronger.
    option tcp-check
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send GET\ __haproxy_probe__\r\n
    tcp-check expect ! string LOADING

    # If the RESP door has a password, authenticate first and keep the
    # rest of the sequence unchanged:
    #   tcp-check send AUTH\ <password>\r\n
    #   tcp-check expect string +OK

    # Every node, same weight.  There is no master to prefer and no
    # slave to read from - each of these is equally able to answer
    # anything.
    server pc1 10.0.0.11:6379 check inter 2s fall 3 rise 2
    server pc2 10.0.0.12:6379 check inter 2s fall 3 rise 2
    server pc3 10.0.0.13:6379 check inter 2s fall 3 rise 2

frontend redis_vip
    mode tcp
    bind 10.0.0.10:6379
    # A cache connection is idle between bursts; the classic HAProxy
    # trap in front of Redis is the default timeout silently closing
    # long-lived pooled connections.
    timeout client 1h
    default_backend perfcached

# these belong in your global `defaults`, shown here for completeness
#   timeout connect 5s
#   timeout server  1h

#---------------------------------------------------------------------
# MIGRATING FROM SENTINEL, with no client change at all
#---------------------------------------------------------------------
# The repoint is a BACKEND-ONLY edit: the frontend and the VIP address
# stay exactly as they are, so every application keeps its single
# configured endpoint.  Swap the server lines to the perfcached RESP
# doors and delete the sentinel tier.
#
# Even a sentinel-era check survives the change: the classic
#     tcp-check send INFO\ replication\r\n
#     tcp-check expect string role:master
# passes on EVERY perfcached node, because every node reports
# role:master - truthfully, since every node is writable.  It is a
# liveness check with the same warming blind spot as redis-check
# though, so move to the sequence above when convenient.
#
# If the current setup has SEPARATE read and write endpoints (HAProxy
# splitting reads to the slaves), point both at this one pool - every
# node serves both - and collapse them to a single endpoint at leisure.
#
# WHAT IT COSTS.  Round-robin through a proxy is the "unrouted" path:
# parity to about 1.9x below a routing client at pipeline depth 1, and
# 3-4x below when pipelined.  Always correct, no collapse under load,
# and better tail latency under enumeration than the Redis it replaces.
# It is the compatibility tier - correct and serviceable, not the fast
# path.  A service that needs the fast path moves to a cluster-aware
# client and talks to the nodes directly, bypassing this file.
