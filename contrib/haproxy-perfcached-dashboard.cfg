# haproxy-perfcached-dashboard.cfg - N dashboards behind one address
# (DESIGN 12no, S416).  Copy the pieces you need into your haproxy.cfg.
#
# A perfcached-dashboard holds no state worth replicating - the fleet's
# state lives in the daemons - so redundancy is running several and
# spreading over them.  Two things make that plain HTTP load balancing:
#
#   * GET /health answers 200 while the dashboard can see at least one
#     member and 503 when it sees none - the check below takes a blind
#     dashboard out of rotation;
#   * the instances share `session_key` in /etc/perfcached/perfcached-
#     dashboard.conf, so a privileged session opened on one is honoured
#     by the others (the token the browser holds carries the session,
#     encrypted under that key) - no stickiness is needed.
#
# The browser's TLS terminates here, and the hop to each dashboard on
# another host is TLS again (`ssl` on the server lines, tls_cert/tls_key in
# each dashboard's conf): since 0.7.4 a dashboard takes the enable secret
# only over its own TLS or from its own host.  HTTP/2 from the browser is
# HAProxy's business too (alpn h2 on the bind line).

frontend dashboard
    bind :443 ssl crt /etc/haproxy/certs/dashboard.pem alpn h2,http/1.1
    bind :80
    http-request redirect scheme https unless { ssl_fc }
    # the dashboard sets its own hardening headers; these add the transport's
    http-response set-header Strict-Transport-Security "max-age=31536000"
    default_backend dashboards

backend dashboards
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # a dashboard that answers but sees no member says 503 - checked out
    # until it sees one again; a crashed one is checked out by the connect
    default-server inter 3s fall 2 rise 2
    # the dashboards' own per-address lockout counts wrong enable secrets
    # by the address it sees - forward the client's so the lockout is per
    # browser, not per proxy
    http-request set-header X-Forwarded-For %[src]
    # how the browser came: a dashboard refuses the enable secret unless https
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http unless { ssl_fc }
    server dash1 10.0.0.11:8090 check ssl verify required ca-file /etc/haproxy/certs/dashboard-ca.pem
    server dash2 10.0.0.12:8090 check ssl verify required ca-file /etc/haproxy/certs/dashboard-ca.pem
    server dash3 10.0.0.13:8090 check ssl verify required ca-file /etc/haproxy/certs/dashboard-ca.pem backup
