# nginx-perfcached-dashboard.conf - N dashboards behind one address
# (DESIGN 12no, S416).  Drop into /etc/nginx/conf.d/ and edit the names.
#
# See haproxy-perfcached-dashboard.cfg for what makes this plain load
# balancing: GET /health is 503 while a dashboard sees no member, and
# instances sharing `session_key` honour each other's session tokens, so
# no stickiness is needed.  nginx (open source) has no active health
# check: a 503 or a refused connect sends the request to the next
# upstream (proxy_next_upstream) and the failing one is skipped for
# fail_timeout after max_fails such answers.
#
# TLS, HTTP/2 and HTTP/3 terminate here; the dashboards speak plain
# HTTP/1.1 behind (keep-alive to them, so the poll every 3 s reuses one
# connection).

upstream perfcached_dashboards {
    server 10.0.0.11:8090 max_fails=2 fail_timeout=10s;
    server 10.0.0.12:8090 max_fails=2 fail_timeout=10s;
    server 10.0.0.13:8090 backup;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # HTTP/3 (nginx 1.25+ built with QUIC): the browser learns it from Alt-Svc
    # listen 443 quic reuseport;
    # listen [::]:443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name dashboard.example.net;
    ssl_certificate     /etc/nginx/certs/dashboard.pem;
    ssl_certificate_key /etc/nginx/certs/dashboard.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://perfcached_dashboards;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # the dashboards' per-address lockout counts wrong enable secrets
        # by the address they see - forward the client's
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        # a blind dashboard (503) or a dead one: the next upstream answers
        proxy_next_upstream error timeout http_503;
        proxy_next_upstream_tries 3;
        # the bodies are a few dozen bytes; the tool refuses more anyway
        client_max_body_size 8k;
        proxy_read_timeout 15s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.net;
    return 301 https://$host$request_uri;
}
