# nginx-compose.conf - the front of compose.yml: TLS and HTTP/2 on 8443
# from /etc/nginx/certs/dashboard.pem + dashboard.key, 8080 redirects, two
# replicas behind.  Open-source nginx has no active health check: a
# replica that fails to answer, or answers 503 (a dashboard that sees no
# member says so on every route but the page), sends the request to the
# other one at once and is skipped for fail_timeout after max_fails such
# answers - nothing a browser notices.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    upstream dashboards {
        server dashboard1:8080 max_fails=2 fail_timeout=10s;
        server dashboard2:8080 max_fails=2 fail_timeout=10s;
        keepalive 8;
    }
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        # HTTP/3 (an nginx built with QUIC): the browser learns it from Alt-Svc
        # listen 8443 quic reuseport;
        # listen [::]:8443 quic reuseport;
        # add_header Alt-Svc 'h3=":8443"; ma=86400' always;
        ssl_certificate     /etc/nginx/certs/dashboard.pem;
        ssl_certificate_key /etc/nginx/certs/dashboard.key;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location / {
            proxy_pass http://dashboards;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # the browser's address, SET (not appended) so a client cannot
            # forge it; each replica's nginx passes it through
            # (PCD_FRONT_PROXY=yes) to the dashboard's per-browser lockout
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            client_max_body_size 64m;
            proxy_read_timeout 15s;
        }
    }
    server {
        listen 8080;
        listen [::]:8080;
        return 301 https://$host:8443$request_uri;
    }
}
