# nginx in front of the dashboard inside the admin image - TLS and HTTP/2
# on 8443 from the mounted /etc/perfcached/tls/{cert,key}.pem; 8080 redirects.
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    upstream dashboard { server 127.0.0.1:8090; keepalive 8; }
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        ssl_certificate     /etc/perfcached/tls/cert.pem;
        ssl_certificate_key /etc/perfcached/tls/key.pem;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location / {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            client_max_body_size 8k;
            proxy_read_timeout 15s;
        }
    }
    server {
        listen 8080;
        listen [::]:8080;
        return 301 https://$host:8443$request_uri;
    }
}
