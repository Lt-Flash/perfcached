# nginx in front of the dashboard inside the admin image - plain HTTP on
# 8080 (no certificate mounted).  The dashboard listens on the container's
# loopback; the lockout counts the client the proxy saw (trusted_proxy =
# 127.0.0.1 in the rendered dashboard config).
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    upstream dashboard { server 127.0.0.1:8090; keepalive 8; }
    server {
        listen 8080;
        listen [::]:8080;
        location / {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            client_max_body_size 8k;
            proxy_read_timeout 15s;
        }
    }
}
