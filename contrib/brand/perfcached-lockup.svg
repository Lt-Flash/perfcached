<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" width="520" height="96" role="img" aria-label="perfcached - found fast, kept safe">
  <title>perfcached lockup</title>
  <desc>The still anchor mark at left; the word perfcached in a leaning cut with tight tracking; the tagline "found fast, kept safe" set small and wide beneath it.  The mark is upright on purpose: the lean is where the speed lives.  For production, set the word in a true oblique of a geometric sans rather than a mechanical skew.</desc>
  <style>
    .ink { stroke: #1b1f24; }
    .word { fill: #1b1f24; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 46px; letter-spacing: -1.8px; }
    .tag { fill: #6b7482; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 1.2px; }
    .kept { fill: #9aa4b2; }
    .found { fill: #2f6df6; }
    .plate { fill: #ffffff; stroke: #d9dee5; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e6e9ee; }
      .word { fill: #e6e9ee; }
      .tag { fill: #9aa4b2; }
      .kept { fill: #6b7482; }
      .plate { fill: #14181d; stroke: #2a313a; }
    }
  </style>
  <g transform="translate(16 16)">
    <rect class="plate" x="0.5" y="0.5" width="63" height="63" rx="13" stroke-width="1"/>
    <line class="ink" x1="32" y1="16" x2="32" y2="52" stroke-width="2.5" stroke-linecap="round"/>
    <line class="ink" x1="18" y1="24" x2="46" y2="24" stroke-width="2.5" stroke-linecap="round"/>
    <path class="ink" d="M32 54 Q19 56 13 46" fill="none" stroke-width="2.5" stroke-linecap="round"/>
    <path class="ink" d="M32 54 Q45 56 51 46" fill="none" stroke-width="2.5" stroke-linecap="round"/>
    <rect class="found" x="26.5" y="5" width="11" height="11" rx="3"/>
    <rect class="kept" x="4" y="36" width="11" height="11" rx="2.5"/>
    <rect class="kept" x="49" y="36" width="11" height="11" rx="2.5"/>
    <rect class="kept" x="26.5" y="50" width="11" height="11" rx="2.5"/>
  </g>
  <g transform="skewX(-7)">
    <text class="word" x="110" y="58">perfcached</text>
  </g>
  <text class="tag" x="104" y="84">found fast, kept safe</text>
</svg>
