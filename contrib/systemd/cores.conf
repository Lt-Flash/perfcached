# /etc/systemd/system/perfcached.service.d/cores.conf - S357 (from S356, DESIGN 12kg)
#
# Keep a core when the daemon crashes.  The service runs as perfcached under
# ProtectSystem=strict, so with the kernel's default core_pattern ("core",
# relative) it has nowhere to write one: the first crash on a test fleet left
# nothing.  The working directory becomes a directory the service owns, the
# core size limit is lifted, and only the newest two cores are kept, so a crash
# loop cannot fill the filesystem the WAL lives on.
#
# If core_pattern is a pipe (systemd-coredump, apport), cores go there instead
# and this directory stays empty: `cat /proc/sys/kernel/core_pattern`.
# Worth having on release builds too.  systemctl daemon-reload, then restart.
[Service]
WorkingDirectory=/var/lib/perfcached/cores
LimitCORE=infinity
ExecStartPre=+/bin/sh -c 'install -d -o perfcached -g perfcached -m 700 /var/lib/perfcached/cores; ls -1t /var/lib/perfcached/cores/core.* 2>/dev/null | tail -n +3 | xargs -r rm -f'
