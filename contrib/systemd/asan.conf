# /etc/systemd/system/perfcached.service.d/asan.conf - S357 (from S356, DESIGN 12kh)
#
# For an asan-flavor build (make menuconfig, or make PC_BUILD=asan): the
# sanitizers stop the daemon on the first fault and write their report where
# the service can write - next to the cores of cores.conf, which this needs.
# A sanitizer core would be terabytes of shadow memory, so the report, not a
# core, is the evidence.  detect_leaks=0 as in make check-asan: the daemon
# leaves its arena's setup to the exit by design, and a leak report on every
# clean stop would bury a real fault.  Never on a release build: the
# variables do nothing there.  systemctl daemon-reload, then restart.
[Service]
Environment=ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:quarantine_size_mb=64:log_path=/var/lib/perfcached/cores/asan
Environment=UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1:log_path=/var/lib/perfcached/cores/ubsan
