# sysctl-perfcached.conf — optional hugepage pool for the arena (S24).
#
# The arena works WITHOUT this: the backing ladder degrades from
# MAP_HUGETLB through transparent hugepages down to 4K pages per chunk.
# A reserved pool just makes the top tier deterministic.
#
# Size it to the sum of arena_mb across collections' daemons on the
# host, in 2MB pages: 1024MB arena -> 512 pages.
#
# THE TRAP (learned in production): on a live host the kernel routinely
# UNDER-DELIVERS this reservation - fragmentation caps it silently.
# After applying, READ BACK HugePages_Total in /proc/meminfo.  If it is
# short: stop big consumers, then
#   echo 3 > /proc/sys/vm/drop_caches
#   echo 1 > /proc/sys/vm/compact_memory
# and re-apply.  Never assume the sysctl took.
#
# Install: cp contrib/sysctl-perfcached.conf /etc/sysctl.d/90-perfcached.conf
#          sysctl --system && grep HugePages_Total /proc/meminfo

#vm.nr_hugepages = 512

# ---------------------------------------------------------------------
# Cluster receive buffer (S-ledger 2026-08-27).
#
# The peer plane bursts: a pipelined client write burst on a proxy or
# shard collection puts ONE forward datagram per key on the wire at
# once, each up to 58KB.  A dropped forward is a REFUSED CLIENT WRITE -
# forwards carry no retry (migrations do, via the ack window).
#
# perfcached asks for an 8MB receive buffer and tries SO_RCVBUFFORCE
# first, which bypasses this limit where the daemon holds CAP_NET_ADMIN
# (systemd: AmbientCapabilities=CAP_NET_ADMIN).  WITHOUT that capability
# the kernel silently clamps the request to net.core.rmem_max - the
# default 208KB - and drops datagrams under burst.  MEASURED: 120
# pipelined 40KB writes lost 4-6 forwards per run at the default, UDP
# RcvbufErrors matching the refused writes one for one.
#
# The daemon logs a WARNING naming the effective size when it is
# clamped, and reports it as cluster.rcvbuf in `stats` - check there
# rather than assuming this took.
#
# Set this if you do NOT grant CAP_NET_ADMIN:
#net.core.rmem_max = 8388608
