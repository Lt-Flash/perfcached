# perfcached CI - private GitLab edition (S55).  This is the file
# changes are PROVEN against; .github/workflows/ci.yml is ported from
# here once a job shape works.  Any executor that can apt-get works;
# the fullest coverage comes from a shell runner ON the build host
# running as root (loop/dm fixture + real mlock) - with a docker
# executor those tests announce SKIP and the rest still gates.
# The deps line tolerates a read-only/preinstalled toolchain so the
# same file drives both executor kinds.
#
# TIERED since 2026-09-02.  The full suite costs ~an hour of a shared
# build host, which is too slow to sit between a developer and every
# commit.  So:
#   branch push -> lint + the FAST gate (~5 min): every unit binary
#                  and the seconds-long suites, so a commit is still
#                  individually accountable and a break bisects to one
#                  commit rather than to a week of them
#   TAG push    -> the whole ladder, natively and under ASan+UBSan.
#                  A tag is how a feature set is declared ready, and
#                  it is what release promises are made from.
# The heavy jobs therefore key on $CI_COMMIT_TAG, not on a branch.

stages: [lint, fast, full, arch, nightly]

.deps: &deps
  - apt-get update -qq && apt-get install -y -qq gcc make libsodium-dev
    libevent-dev >/dev/null
    || echo "deps install failed - relying on preinstalled toolchain"

# GATING since the 2026-09-01 triage took the baseline to ZERO: a red
# tidy job means a real finding, and it runs FIRST so five minutes of
# lint fail-fasts the pipeline before anything expensive is spent.
clang-tidy:
  stage: lint
  image: debian:13
  timeout: 45m
  before_script:
    - apt-get update -qq && apt-get install -y -qq gcc make libsodium-dev
      libevent-dev clang-tidy bear >/dev/null
      || echo "deps install failed - relying on preinstalled toolchain"
  script:
    # clean first: on a shell runner the clone is shared across jobs,
    # and bear records nothing from an up-to-date build
    - make clean && bear -- make -j"$(nproc)"
    # the Makefile compiles+links in one cc line, so the archive rides
    # each source's compile command - without the -Wno, clang counts
    # "libperfd.a: linker input unused" as an ERROR and tidy exits 1
    - git ls-files 'src/*.c' 'lib/*.c' 'cli/*.c'
      | xargs clang-tidy -p .
      --extra-arg=-Wno-unused-command-line-argument 2>/dev/null
      | tee tidy.log
    - 'grep -cE "warning:|error:" tidy.log || echo "0 findings"'

# The ratchet on every commit: builds, and everything that can prove
# itself in seconds actually runs.
check-fast:
  stage: fast
  image: debian:13
  timeout: 30m
  before_script: *deps
  script:
    - make -j"$(nproc)"
    - tools/netns-run.sh make check-fast

# The full ladder: tags only - as SEVEN suite GROUPS (Makefile CHECK_GROUPS,
# `make check-g-<group>`), each its own job, plain and under ASan+UBSan.
# 2026-10-03: the single check had grown to ~90 min (its 90m ceiling was
# already raised to 150 after rc65 took 90 and a 0.4.0 re-point was killed
# at exactly 90) and check-asan to ~95, and one red suite cost a full
# rerun.  Groups are balanced to ~13-17 min under ASan; the shell runner
# takes six jobs at once (concurrent = 6 since 2026-10-03) and
# netns-run.sh gives each job its own loopback, so the suites' fixed ports
# and multicast groups cannot collide.  A red group is retried alone.
#
# CHECK_GROUPS (comma-separated, e.g. "repl1,cluster2") runs only those
# groups - on a manual pipeline, or `git push -o ci.variable=CHECK_GROUPS=
# repl1` to run chosen groups on a branch push.  Unset: every group.
.groups: &groups
  parallel:
    matrix:
      - GROUP: [core, durability, cluster1, cluster2, repl1, repl2, repl3]

.group-filter: &group-filter
  - case ",$CHECK_GROUPS," in ",,"|*",$GROUP,"*) ;; *) echo "group $GROUP not in CHECK_GROUPS=$CHECK_GROUPS - skipped"; exit 0;; esac

check:
  stage: full
  image: debian:13
  timeout: 60m
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CHECK_GROUPS
  <<: *groups
  before_script: *deps
  script:
    - *group-filter
    - make -j"$(nproc)"
    - tools/netns-run.sh make check-g-$GROUP

# S250: the standalone edition - no cluster code, its own gate
check-standalone:
  stage: full
  image: debian:13
  timeout: 60m
  rules:
    - if: $CI_COMMIT_TAG
  before_script: *deps
  script:
    - make clean
    - make PC_EDITION=standalone -j"$(nproc)"
    - ./perfcached -V | grep -q standalone
    - tools/netns-run.sh make PC_EDITION=standalone check-standalone

# S285: Alpine - musl and gcc 15 - a supported runtime from 0.5.0.  Both
# editions compile, the standalone edition runs check-standalone, all
# inside an alpine container (podman here - the runner is the build host).
# Tag-only, beside the other full-ladder jobs.
alpine:
  stage: full
  timeout: 60m
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - tools/alpine-check.sh

# The four-arch matrix (S27), tag-only and AFTER the x86_64 suites pass
# (S60).  The ordering is the whole point: emulated arm32 is 8-16x
# slower, so spending 20+ minutes of it on a tree whose native suite is
# already red tells us nothing we do not already know.  A separate stage
# expresses that more plainly than a needs: graph.
#
# It runs on the shell runner because that is where podman and qemu-user
# binfmt live; anywhere else the script announces a loud SKIP rather than
# passing quietly, so a mis-scheduled job cannot masquerade as coverage.
matrix:
  stage: arch
  timeout: 60m
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - tools/matrix.sh

# Highest-value job (S55 ordering): the whole suite under ASan+UBSan,
# same spelling as the local pre-push loop - per group, as check above.
check-asan:
  stage: full
  image: debian:13
  timeout: 60m
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CHECK_GROUPS
  <<: *groups
  before_script: *deps
  script:
    - *group-filter
    - tools/netns-run.sh make check-asan-g-$GROUP

# S55 item 4: memcheck, NIGHTLY and LOCAL - "slow, not CI material".
# It runs here because this runner IS the build host, and only on a
# schedule: never on a push, so it cannot sit between a developer and a
# commit.  Create the schedule in GitLab (CI/CD -> Schedules); without
# one this job simply never runs.
#
# Scope is the UNIT binaries, not `make check` wholesale.  Memcheck
# costs ~20x, and the integration suites start a real daemon behind
# fixed startup waits - under valgrind those time out, so a full-suite
# nightly would report timeouts instead of findings and train everyone
# to ignore red.  That is the same argument this section uses to defer
# TSan, and it applies here.  The unit binaries are also where the
# class this job exists for lives: uninitialised reads, which ASan does
# not see and MSan cannot reach.
valgrind:
  stage: nightly
  timeout: 120m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script: *deps
  script:
    - apt-get install -y -qq valgrind >/dev/null || true
    - tools/nightly-valgrind.sh
