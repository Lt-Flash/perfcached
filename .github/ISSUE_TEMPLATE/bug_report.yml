name: Bug report
description: perfcached, libperfd or one of the tools does something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting.  A security problem goes privately, not here: see SECURITY.md.
  - type: textarea
    id: version
    attributes:
      label: perfcached version
      description: The output of `perfcached -V`.
      render: text
      placeholder: |
        perfcached 0.7.5 (89e55817)
        tls: OpenSSL 3.0.17 1 Jul 2025
    validations:
      required: true
  - type: input
    id: libperfd
    attributes:
      label: libperfd version
      description: The output of `perfcli -V` (it names its libperfd), or `pkg-config --modversion libperfd` for the libperfd your application links.  Write "none" if no libperfd client is involved.
      placeholder: perfcli 0.7.5 (libperfd 0.7.6)
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP extension version
      description: The output of `php -r 'echo phpversion("perfcached"), " (libperfd ", Perfcached::LIBPERFD, ")\n";'`.  Write "none" if the PHP extension is not involved.
      placeholder: 0.1.1 (libperfd 0.7.6)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Edition and install
      options:
        - perfcached package (clustered)
        - perfcached-standalone package
        - Alpine apk
        - release tarball
        - built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Debian 13, amd64
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
  - type: textarea
    id: cluster
    attributes:
      label: Cluster
      description: If clustered - the mode of the collections involved, the number of nodes, discovery (multicast or unicast).
  - type: textarea
    id: config
    attributes:
      label: Config
      description: perfcached.conf with every secret, password and token removed.
      render: ini
  - type: textarea
    id: log
    attributes:
      label: Log around the event
      render: text
