# perfcached CI (S55).  Public repo: GitHub-hosted runners are free,
# unlimited minutes.  GitHub-hosted ONLY - never register project hosts
# as self-hosted runners here; a fork PR could execute on them.
name: ci

on:
  push:
    branches: [master]
    # release tags carry their own visible test run - the compat
    # promise is made FROM tags, so the green belongs on the tag
    tags: ['v*']
  pull_request:

jobs:
  # The ratchet: "pushed = check-green" without human discipline.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: build
        run: make -j"$(nproc)"
      - name: make check
        run: make check
      # make check runs unprivileged here, so the suites that build
      # network namespaces SKIP inside it; run them as root, with the
      # multicast router mcastttltest needs (its system service off -
      # the test runs its own router in a namespace)
      - name: root-only suites (netns, multicast router)
        run: |
          sudo apt-get install -y smcroute
          sudo systemctl disable --now smcroute || true
          sudo sh test/addrwaittest.sh ./perfcached
          sudo sh test/mcastttltest.sh ./perfcached
          sudo sh test/dnsseedtest.sh ./perfcached
          sudo sh test/lanetest.sh ./perfcached
          sudo sh test/udpblocktest.sh ./perfcached
      - name: failing suites, if any
        if: failure()
        run: |
          grep -oE "[a-z]+test: [0-9]+ passed, [0-9]+ failed" check.log \
            2>/dev/null | grep -vE ", 0 failed$" || true

  # S250: the standalone edition - no cluster code, its own gate
  check-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: build (standalone)
        run: make PC_EDITION=standalone -j"$(nproc)" && ./perfcached -V | grep -q standalone
      - name: make check-standalone
        run: make PC_EDITION=standalone check-standalone

  # Highest-value job (S55 ordering): the whole suite under ASan+UBSan.
  # Same spelling as the local pre-push loop: `make check-asan`.
  check-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: make check-asan
        run: make check-asan

  # GATING since the 2026-09-01 triage took the baseline to ZERO: a
  # red tidy job now means a real finding, so it is allowed to gate.
  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev clang-tidy bear
      - name: compile_commands
        run: make clean && bear -- make -j"$(nproc)"
      - name: tidy
        # -Wno-unused-command-line-argument: the Makefile compiles+links
        # in one cc line, so libperfd.a rides the cli sources' compile
        # commands and clang counts it as an ERROR without this
        run: |
          git ls-files 'src/*.c' 'lib/*.c' 'cli/*.c' \
            | xargs clang-tidy -p . \
              --extra-arg=-Wno-unused-command-line-argument \
              2>/dev/null | tee tidy.log
          echo "---- summary ----"
          grep -cE "warning:|error:" tidy.log || echo "0 findings"
